services:
  dashboard:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    env_file:
      - .env.example
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    stdin_open: true
    tty: true

volumes:
  dashboard_node_modules:
